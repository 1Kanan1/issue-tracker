[project]
name = "issue-tracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "aiosqlite>=0.22.1",
  "alembic>=1.19.1",
  "asyncpg>=0.31.0",
  "fastapi[standard]>=0.141.1",
  "greenlet>=3.5.5",
  "pwdlib[argon2]>=0.3.1",
  "pydantic>=2.13.4",
  "pyjwt>=2.13.0",
  "pytest-cov>=7.1.0",
  "sqlalchemy>=2.0.52",
  "uvicorn>=0.52.4",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0", "ruff>=0.16.10"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy resolves relationship annotations as strings from its own registry
# at mapper configuration time, so the referenced class needs no import. A real
# import would be circular (User -> Issue -> User).
"app/models/*.py" = ["F821"]

[tool.ruff]
target-version = "py313"
